name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npx mw-audit-gate

      - name: Shared files are current
        run: npx mw-sync --check

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js

      - name: Lint HTML (html-validate)
        run: npm run lint:html

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: No test support in the built files
        run: npm run check:dist

      - name: Built site (icon set once, no third-party loads)
        run: npx vitest run tests/dist.test.ts
        env:
          REQUIRE_DIST: '1'

      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

      - name: Lighthouse (accessibility 100, best practices, bundle budgets)
        run: npx lhci autorun

  # The Playwright version in the lockfile, so the browser jobs use the image built for exactly that version.
  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: Browser tests (${{ matrix.project }})
    needs: playwright
    runs-on: ubuntu-latest
    # Every test on all five browser projects, as before. Each project runs in its own job at the same time, so the
    # run takes as long as the slowest project instead of all five in a row; each job runs in Playwright's image for
    # the locked version (the same browser builds, their system libraries installed), so none downloads browsers or
    # apt packages.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      # Chromium's recommended shared-memory setting for containers.
      options: --ipc=host
    env:
      # The image runs as root; Firefox refuses a HOME it does not own.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      # The built console in a real browser against a mocked admin API, under the production CSP, with no network:
      # session expiry, drafts, composing across platforms, publishing moves, the public-roadmap preview.
      - name: Browser tests (mocked admin API)
        run: npm run test:e2e -- --project=${{ matrix.project }}
        env:
          E2E_BROWSERS: all

  image:
    name: Image (build and probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not pushed. Builds the Dockerfile as the release does (the inline-script check included) and runs the
      # container the way the cluster does: non-root user, read-only root, no capabilities.
      - name: Build (not pushed)
        run: docker build --tag content-hub-ui:ci .
      - name: Probe the container (user, /, headers, bundle, licences)
        run: bash scripts/smoke.sh content-hub-ui:ci
